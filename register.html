<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <center>
        <h1>Error Makes Celever Academy🚀</h1>
        <h5>Training | Tech News | Freshers Guide</h5>
        <p>Empoering young developers to level up their skills through corporate Training</p>
    </center>
    <hr>
    <center>
        <h1>Rgistration Form</h1>
        <form>
            <table>
                <tr>
                    <td>Name:</td> <td><input type="text" placeholder="enter your name"> </td>
                </tr>
                <tr>
                    <td>Age:</td> <td><input type="number" placeholder="enter your age"> </td>
                </tr>
                <tr>
                    <td>Gender:</td> 
                    <td>
                        <input type="radio" name="Gender">Male
                        <input type="radio" name="Gender">Female 
                    </td>
                </tr>
                <tr>
                    <td>Email:</td> <td><input type="text" placeholder="enter your email"> </td>
                </tr>
                <tr>
                    <td>Select a course:</td>
                    <td>
                        <select>
                            <option>Python Programming</option>
                            <option>Data Analytics</option>
                            <option>Fullstack Development</option>
                            <option>Java</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload your resume </td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
                <tr>
                    <td><input type="reset"></td>
                    <td><input type="submit"></td>
                </tr>
            </table>
        </form>
    </center>
    <hr>
    <p>
        <center>
            <a href="index.html">Home</a> |<a href="https://www.instagram.com/errormakesclever/"> Instagram </a> | <a href="https://www.youtube.com/@ErrorMakesClever">Youtube</a>
        </center> 
    </p>
    
</body>
</html>
